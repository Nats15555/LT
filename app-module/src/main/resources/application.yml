server:
  port: 8080

spring:
  application:
    name: app-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loadtest}
    username: ${SPRING_DATASOURCE_USERNAME:loadtest}
    password: ${SPRING_DATASOURCE_PASSWORD:loadtest}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: testTaskEvent:com.loadtest.app.dto.TestTaskEvent

kafka:
  topic:
    test-tasks: test-tasks
    summarization-tasks: summarization-tasks

loadtest:
  upload:
    max-scenario-file-size-bytes: 10485760
  external-summary:
    window-minutes: 2
  external-llm:
    receiver-url: ${LOADTEST_EXTERNAL_LLM_RECEIVER_URL:}
    rewrite-docker-service-host-to: ${LOADTEST_EXTERNAL_LLM_REWRITE_DOCKER_SERVICE_HOST_TO:}

logging:
  level:
    com.loadtest: INFO
    org.springframework: INFO
