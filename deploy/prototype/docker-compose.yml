name: loadtest-prototype

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-0:5432/loadtest
  SPRING_DATASOURCE_USERNAME: loadtest
  SPRING_DATASOURCE_PASSWORD: loadtest
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-restart: &restart-unless-stopped
  restart: unless-stopped

x-pg-repmgr-env: &pg-repmgr-env
  POSTGRESQL_POSTGRES_PASSWORD: loadtest_admin
  POSTGRESQL_USERNAME: loadtest
  POSTGRESQL_PASSWORD: loadtest
  POSTGRESQL_DATABASE: loadtest
  REPMGR_PASSWORD: repmgr_secret
  REPMGR_PRIMARY_HOST: postgres-0
  REPMGR_PRIMARY_PORT: "5432"
  REPMGR_PARTNER_NODES: postgres-0,postgres-1,postgres-2

services:
  postgres-0:
    <<: *restart-unless-stopped
    image: docker.io/bitnamilegacy/postgresql-repmgr:16
    container_name: loadtest-prototype-postgres-0
    mem_limit: 512m
    environment:
      <<: *pg-repmgr-env
      REPMGR_NODE_NAME: postgres-0
      REPMGR_NODE_NETWORK_NAME: postgres-0
    volumes:
      - postgres-0-data:/bitnami/postgresql
      - ../../docker-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    networks:
      - loadtest-prototype-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest -d loadtest"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 40s

  postgres-1:
    <<: *restart-unless-stopped
    image: docker.io/bitnamilegacy/postgresql-repmgr:16
    container_name: loadtest-prototype-postgres-1
    mem_limit: 512m
    depends_on:
      postgres-0:
        condition: service_healthy
    environment:
      <<: *pg-repmgr-env
      REPMGR_NODE_NAME: postgres-1
      REPMGR_NODE_NETWORK_NAME: postgres-1
    volumes:
      - postgres-1-data:/bitnami/postgresql
    networks:
      - loadtest-prototype-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest -d loadtest"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s

  postgres-2:
    <<: *restart-unless-stopped
    image: docker.io/bitnamilegacy/postgresql-repmgr:16
    container_name: loadtest-prototype-postgres-2
    mem_limit: 512m
    depends_on:
      postgres-0:
        condition: service_healthy
    environment:
      <<: *pg-repmgr-env
      REPMGR_NODE_NAME: postgres-2
      REPMGR_NODE_NETWORK_NAME: postgres-2
    volumes:
      - postgres-2-data:/bitnami/postgresql
    networks:
      - loadtest-prototype-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest -d loadtest"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s

  zookeeper:
    <<: *restart-unless-stopped
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: loadtest-prototype-zookeeper
    mem_limit: 384m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - loadtest-prototype-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    <<: *restart-unless-stopped
    image: confluentinc/cp-kafka:7.6.1
    container_name: loadtest-prototype-kafka
    mem_limit: 768m
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - loadtest-prototype-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  app-1:
    <<: *restart-unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
      target: app
    image: loadtest-app:prototype
    container_name: loadtest-prototype-app-1
    mem_limit: 768m
    environment:
      <<: *java-env
    depends_on:
      postgres-0:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - loadtest-prototype-network

  app-2:
    <<: *restart-unless-stopped
    image: loadtest-app:prototype
    container_name: loadtest-prototype-app-2
    mem_limit: 768m
    environment:
      <<: *java-env
    depends_on:
      app-1:
        condition: service_started
      postgres-0:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - loadtest-prototype-network

  app-lb:
    <<: *restart-unless-stopped
    image: nginx:1.27-alpine
    container_name: loadtest-prototype-app-lb
    mem_limit: 128m
    depends_on:
      - app-1
      - app-2
    ports:
      - "18080:8080"
    volumes:
      - ./nginx/app-lb.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - loadtest-prototype-network

  test-app-1:
    <<: *restart-unless-stopped
    image: test-apps-test-app-1:latest
    container_name: test-app-1
    mem_limit: 256m
    environment:
      SPRING_APPLICATION_NAME: test-app-1
      SERVER_PORT: 8080
      MANAGEMENT_METRICS_EXPORT_ELASTIC_ENABLED: "false"
    networks:
      - loadtest-prototype-network

  execution:
    <<: *restart-unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
      target: execution
    image: loadtest-execution:prototype
    container_name: loadtest-prototype-execution
    mem_limit: 768m
    ports:
      - "18082:8082"
    environment:
      <<: *java-env
      DOCKER_HOST: unix:///var/run/docker.sock
      CONTAINER_DEFAULT_NETWORK: loadtest-prototype_loadtest-prototype-network
      FILE_STORAGE_WORKING_DIR: /data/loadtest
      LOADTEST_EXECUTION_NAMED_VOLUME_FOR_CHILD_BINDS: loadtest-prototype_execution-data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - execution-data:/data/loadtest
    depends_on:
      postgres-0:
        condition: service_healthy
      kafka:
        condition: service_healthy
      test-app-1:
        condition: service_started
    networks:
      - loadtest-prototype-network

  metrics-collector:
    <<: *restart-unless-stopped
    build:
      context: ../..
      dockerfile: Dockerfile
      target: metrics-collector
    image: loadtest-metrics-collector:prototype
    container_name: loadtest-prototype-metrics-collector
    mem_limit: 512m
    ports:
      - "18083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *java-env
      LOADTEST_APP_BASE_URL: http://app-lb:8080
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
    depends_on:
      postgres-0:
        condition: service_healthy
      kafka:
        condition: service_healthy
      app-lb:
        condition: service_started
    networks:
      - loadtest-prototype-network

  litellm:
    <<: *restart-unless-stopped
    profiles: ["summarization"]
    image: ghcr.io/berriai/litellm:main-stable
    container_name: loadtest-prototype-litellm
    mem_limit: 512m
    ports:
      - "14000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-loadtest-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ../../litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - loadtest-prototype-network

  summarization:
    <<: *restart-unless-stopped
    profiles: ["summarization"]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: summarization
    image: loadtest-summarization:prototype
    container_name: loadtest-prototype-summarization
    mem_limit: 512m
    ports:
      - "18085:8085"
    environment:
      <<: *java-env
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-loadtest-local}
      LOADTEST_SUMMARIZATION_LITELLM_BASE_URL_OVERRIDE: http://litellm:4000
    depends_on:
      postgres-0:
        condition: service_healthy
      kafka:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - loadtest-prototype-network

networks:
  loadtest-prototype-network:
    driver: bridge

volumes:
  postgres-0-data:
  postgres-1-data:
  postgres-2-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  execution-data:
