spring:
  main:
    web-application-type: servlet

server:
  port: ${MOCK_SERVER_PORT:8095}

loadtest:
  callback:
    base-url: ${LOADTEST_CALLBACK_BASE_URL:http://host.docker.internal:8080}

mock:
  client-name: ${MOCK_CLIENT_NAME:external-llm-mock}
  wait-minutes: ${MOCK_WAIT_MINUTES:0}

logging:
  level:
    root: INFO
    com.loadtest: INFO
