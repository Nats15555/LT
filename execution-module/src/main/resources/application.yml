server:
  port: 8082

spring:
  application:
    name: execution-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loadtest}
    username: ${SPRING_DATASOURCE_USERNAME:loadtest}
    password: ${SPRING_DATASOURCE_PASSWORD:loadtest}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: execution-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        max.poll.interval.ms: 1800000
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.loadtest.execution.dto.TestTaskEvent
        spring.json.trusted.packages: "*"

kafka:
  topic:
    test-tasks: test-tasks
    metrics-collection-tasks: metrics-collection-tasks

loadtest:
  execution:
    stale-processing-grace-seconds: ${LOADTEST_EXECUTION_STALE_PROCESSING_GRACE_SECONDS:600}
    exited-container-retention-hours: ${LOADTEST_EXECUTION_EXITED_CONTAINER_RETENTION_HOURS:48}
    exited-container-cleanup-interval-ms: ${LOADTEST_EXECUTION_EXITED_CONTAINER_CLEANUP_INTERVAL_MS:3600000}
  summarization:
    default-summarizer-name: ${LOADTEST_DEFAULT_SUMMARIZER_NAME:}

file:
  storage:
    upload-dir: uploads
    working-dir: ""
    artifact-base-path: artifacts
    artifact-reports-subdir: reports
    artifact-metrics-subdir: metrics

container:
  default-network: loadtest_loadtest-network

logging:
  level:
    com.loadtest: INFO
    com.loadtest.execution.ContainerExecutionService: DEBUG
    org.springframework: INFO
